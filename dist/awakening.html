<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a20">
  <meta name="description" content="Qua sông ngầm và đi sâu vào biển Nguyệt Lan để khai khiếu.">
  <title>Đại điển Khai Khiếu · Cổ Chân Nhân</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="awakening.css">
  <script type="module" src="awakening.mjs"></script>
</head>
<body class="ceremony">
  <main class="ceremony-shell">
    <header class="ceremony-head">
      <div><p class="region">Cổ Nguyệt Sơn Trại</p><h1>Đại điển Khai Khiếu</h1></div>
      <a class="subtle nav-link" href="index.html">Về Sơn Trại</a>
    </header>
    <section class="garden-frame" aria-label="Hang Nguyệt Lan">
      <div class="ceremony-hud">
        <div><span class="label">Độ sâu</span><strong><span id="depth">0</span> bước</strong></div>
        <div><span class="label">Tư chất</span><strong id="grade">Chưa khai khiếu</strong></div>
        <label><span class="label">Sức chống áp lực</span><progress id="resolve" max="27" value="27"></progress></label>
      </div>
      <canvas id="garden" tabindex="0" autofocus aria-label="Bản đồ hang Nguyệt Lan" aria-describedby="garden-hint"></canvas>
      <div class="result" id="ceremony-result" hidden>
        <div class="result-panel">
          <p class="region" id="result-depth"></p>
          <h2 id="result-grade" tabindex="-1"></h2>
          <p id="result-note"></p>
          <div class="result-actions">
            <button class="subtle" id="retry" type="button">Thử lại</button>
            <a class="primary nav-link" href="index.html">Về Sơn Trại</a>
          </div>
        </div>
      </div>
      <div class="garden-foot">
        <p id="garden-hint">Qua sông ở đoạn nước nông. Dùng WASD, phím mũi tên hoặc chạm một ô.</p>
        <button class="subtle" id="finish" type="button" disabled>Chốt tư chất</button>
      </div>
    </section>
    <p class="sr-only" id="ceremony-announce" role="status"></p>
  </main>
</body>
</html>
