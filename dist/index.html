<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a20">
  <meta name="description" content="Qua sông ngầm và đi sâu vào biển Nguyệt Lan để khai khiếu.">
  <title>Đại điển Khai Khiếu · Cổ Chân Nhân</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="awakening.css">
  <script type="module" src="awakening.mjs"></script>
</head>
<body class="ceremony">
  <main class="ceremony-shell">
    <header class="ceremony-head">
      <div><p class="region">Cổ Nguyệt Sơn Trại</p><h1>Đại điển Khai Khiếu</h1></div>
      <button type="button" id="change-hero" class="subtle" hidden>Đổi nhân vật</button>
    </header>
    <form class="character-select" id="character-select">
      <fieldset>
        <legend>Chọn nhân vật</legend>
        <div class="character-options">
          <label><input type="radio" name="hero" value="huyen-bao" checked>
            <span class="hero-stage"><img src="assets/huyen-bao-selection.png" width="128" height="128" alt=""></span>
            <strong>Huyền bào</strong><span>Nam cổ sư</span>
          </label>
          <label><input type="radio" name="hero" value="ao-reu">
            <span class="hero-stage"><img src="assets/ao-reu-selection.png" width="128" height="128" alt=""></span>
            <strong>Áo rêu</strong><span>Nữ cổ sư</span>
          </label>
        </div>
      </fieldset>
      <button class="primary" type="submit">Vào hang Nguyệt Lan</button>
    </form>
    <section class="garden-frame" id="ceremony-stage" aria-label="Hang Nguyệt Lan" hidden>
      <div class="ceremony-hud">
        <div class="hud-stat">
          <span class="label">Độ sâu</span>
          <strong><span id="depth">0</span> <small>bước</small></strong>
        </div>
        <div class="hud-stat hud-grade">
          <span class="label">Tư chất</span>
          <strong id="grade">Chưa khai khiếu</strong>
          <div class="tier-track" id="tier-track" aria-hidden="true">
            <span data-tier="10">Đinh</span>
            <span data-tier="20">Bính</span>
            <span data-tier="30">Ất</span>
            <span data-tier="40">Giáp</span>
          </div>
        </div>
        <div class="hud-stat hud-hope">
          <span class="label">Hy Vọng Cổ (<span id="hope-count">0</span>/7)</span>
          <div class="hope-pips" id="hope-pips" role="img" aria-label="0 trên 7 cụm Hy Vọng Cổ">
            <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </div>
        </div>
      </div>
      <div class="stage-viewport">
        <canvas id="garden" tabindex="0" aria-label="Bản đồ hang Nguyệt Lan" aria-describedby="garden-hint"></canvas>
        <div class="ceremony-banner" id="ceremony-banner" aria-hidden="true" hidden>
          <p class="banner-region">Cổ Nguyệt Sơn Trại · Hang Nguyệt Lan</p>
          <p class="banner-title">Đại điển khai khiếu</p>
        </div>
      </div>
      <div class="narration" id="narration-bar" aria-live="polite">
        <span class="narration-tag">Nhân Tổ truyện</span>
        <p id="story-line" role="status"></p>
      </div>
      <div class="result" id="ceremony-result" hidden>
        <div class="result-panel aperture-panel">
          <p class="region" id="result-depth"></p>
          <h2 id="result-grade" tabindex="-1"></h2>
          <div class="aperture-frame">
            <canvas id="aperture-canvas" width="128" height="128" aria-label="Hình ảnh bên trong Không Khiếu và Thanh Đồng Nguyên Hải"></canvas>
          </div>
          <p class="aperture-sea" id="result-sea"></p>
          <p id="result-note"></p>
          <div class="result-actions">
            <button class="subtle" id="retry" type="button">Thử lại</button>
            <a class="primary nav-link" id="enter-village" href="village.html">Xác nhận bắt đầu</a>
          </div>
        </div>
      </div>
      <div class="garden-foot">
        <p id="garden-hint">Qua sông ở đoạn nước nông. Dùng WASD, phím mũi tên hoặc chạm một ô.</p>
      </div>
    </section>
    <p class="sr-only" id="ceremony-announce" role="status"></p>
  </main>
</body>
</html>
