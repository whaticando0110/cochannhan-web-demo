<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111716">
  <meta name="description" content="Khám phá Cổ Nguyệt Sơn Trại và giao chiến với Điện Lang ở bãi săn Thanh Mao.">
  <title>Cổ Chân Nhân · Đường tới bãi săn</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="world.css">
  <link rel="preload" as="image" href="assets/world/dien-lang.png">
  <link rel="preload" as="image" href="assets/rampart/son-trai-nu-nguyet-quang.png">
  <link rel="preload" as="image" href="assets/rampart/nguyet-quang.png">
  <link rel="preload" as="image" href="assets/rampart/hit-bleed.png">
  <link rel="preload" as="image" href="assets/rampart/nguyet-toan.png">
  <link rel="preload" as="image" href="assets/rampart/tung-cham.png">
  <link rel="preload" as="image" href="assets/rampart/guard-russet.png">
  <link rel="preload" as="image" href="assets/rampart/guard-ivory.png">
  <link rel="preload" as="image" href="assets/huyen-bao-combat.png">
  <link rel="preload" as="image" href="assets/ao-reu-combat.png">
  <link rel="preload" as="image" href="assets/rampart/tinh-nghi-portrait.png">
  <script type="module" src="expedition.mjs"></script>
</head>
<body class="journey">
  <a class="skip" href="#field">Tới bản đồ</a>
  <header class="topbar">
    <div class="shell topbar-inner">
      <div class="identity">
        <span class="seal" aria-hidden="true"><i></i></span>
        <div class="match-heading">
          <div>
            <p class="region">Nam Cương <span aria-hidden="true">/</span> Thanh Mao Sơn</p>
            <h1 id="location">Cổ Nguyệt Sơn Trại</h1>
          </div>
          <output class="turn" id="mode">Khám phá</output>
        </div>
      </div>
      <div class="utilities">
        <a href="./" class="subtle nav-link">Khai Khiếu</a>
        <button type="button" class="subtle reset" id="reset-trip">Chơi lại</button>
      </div>
    </div>
  </header>
  <main class="shell expedition">
    <div class="world-layout">
      <section class="world-frame" aria-label="Bản đồ Thanh Mao Sơn">
        <div id="field" class="field-window" tabindex="0" aria-describedby="field-hint" role="group" aria-label="Bản đồ có thể tương tác">
          <div class="field-world" id="world-plane">
            <div class="rampart-forest" id="rampart-forest" aria-hidden="true"></div>
            <div class="field-tiles" id="map"></div>
            <div class="map-ornaments" id="map-ornaments" aria-hidden="true"></div>
            <div class="field-marker gate" id="gate-marker" aria-hidden="true"><span>Cổng đông</span></div>
            <div class="field-marker training" id="training-marker" aria-hidden="true"><span>Vị trí bắn</span></div>
            <div class="field-marker passage" id="end-marker" aria-hidden="true" hidden><span>Lối mòn</span></div>
            <div class="field-unit hero" id="hero-unit" aria-hidden="true"><i class="unit-shadow"></i><i class="sprite"></i></div>
            <div class="field-unit mentor" id="mentor-unit" aria-hidden="true"><i class="unit-shadow"></i><i class="mentor-art"></i></div>
            <div class="field-unit beast" id="wolf-unit" aria-hidden="true" hidden><i class="unit-shadow"></i><i class="wolf-art"></i><progress class="wolf-health"></progress></div>
          </div>
          <section class="trail-card field-status" aria-label="Trạng thái chiến đấu">
            <div class="hero-heading"><span class="hero-portrait" aria-hidden="true"></span><h2 id="hero-name">Phương Nguyên</h2></div>
            <div class="field-vital">
              <div class="vital-note"><span>Sinh lực</span><b id="world-hp"></b></div>
              <progress id="world-hp-meter" aria-label="Sinh lực người chơi"></progress>
            </div>
            <div class="field-vital">
              <div class="vital-note"><span>Chân nguyên</span><b id="world-qi"></b></div>
              <progress class="qi-meter" id="world-qi-meter" aria-label="Chân nguyên người chơi"></progress>
            </div>
            <div class="field-vital" id="wolf-status" hidden>
              <div class="vital-note"><span>Điện Lang</span><b id="wolf-hp"></b></div>
              <progress class="rival-meter" id="wolf-hp-meter" aria-label="Sinh lực sói"></progress>
            </div>
          </section>
          <div class="field-shade" aria-hidden="true"></div>
          <div class="field-caption"><span id="coordinates"></span></div>
          <div id="defeat" class="result" hidden>
            <div class="result-panel">
              <h2>Bạn đã gục</h2>
              <p>Thử lại từ lúc chạm trán sói.</p>
              <button id="retry-encounter" type="button" class="primary">Thử lại trận</button>
            </div>
          </div>
        </div>
        <div class="field-footer">
          <span id="field-hint">Bấm ô để đi, hoặc dùng WASD và phím mũi tên.</span>
          <button class="run-toggle" id="cast-moon" type="button" aria-keyshortcuts="F" hidden><kbd>F</kbd> Nguyệt Quang <small>−2 chân nguyên</small></button>
          <button class="run-toggle" id="run-toggle" type="button" aria-label="Chế độ chạy" aria-pressed="false" aria-keyshortcuts="Shift">Chạy · Tắt</button>
        </div>
      </section>

      <aside class="world-sidebar" aria-label="Mục tiêu và trạng thái">
        <section class="trail-card" id="objective-card">
          <span class="quest-mark" aria-label="Mục tiêu">◆</span>
          <h2 id="objective-title"></h2>
          <p id="objective-detail"></p>
          <button type="button" class="trail-guide" id="guide"></button>
        </section>

        <section class="trail-card encounter-intent" id="wolf-intent" hidden>
          <div class="panel-label"><i class="marker" aria-hidden="true"></i> Ý định của sói</div>
          <h2 id="wolf-intent-name"></h2>
          <p id="wolf-intent-detail"></p>
        </section>
      </aside>

    </div>
    <div class="sr-only" role="status" id="world-announcement"></div>
  </main>
  <dialog class="mentor-dialog" id="mentor-dialog" aria-labelledby="mentor-name" aria-describedby="mentor-line">
    <div class="mentor-dialog-content">
      <img class="mentor-portrait" src="assets/rampart/tinh-nghi-portrait.png" width="128" height="128" alt="">
      <div class="mentor-copy">
        <h2 id="mentor-name">Cổ Nguyệt Tĩnh Nghi</h2>
        <p id="mentor-line" aria-live="polite"></p>
      </div>
      <button type="button" class="trail-guide" id="mentor-next" autofocus>Tiếp tục</button>
    </div>
  </dialog>
</body>
</html>
